<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BIODATA BAPEKOM</title>
    
    <link rel="stylesheet" href="css/style.css?v=3.0">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="main-wrapper">
        
        <header class="logo-section">
            <div class="profile-avatar">
                <img src="img/Logo 2.png" alt="Bapekom Logo">
            </div>
        </header>

        <main class="form-container">
            
            <div class="form-intro">
                <h1>BIODATA BAPEKOM</h1>
                <div class="warning-alert">
                    <p><strong>PENTING:</strong> Wajib diisi dengan data asli untuk keperluan administrasi kantor dan penggajian.</p>
                </div>
            </div>

            <form id="biodata-form">
                
                <div class="form-group">
                    <label>Pas Foto Berwarna <span class="req">*</span></label>
                    <div class="upload-box" id="drop-zone">
                        <span class="upload-text">Ketuk untuk Ambil Foto</span>
                        <input type="file" name="foto" id="foto-input" accept="image/*" required>
                    </div>
                    <div id="preview-container"></div>
                </div>

                <div class="form-group">
                    <label>Nama Lengkap <span class="req">*</span></label>
                    <input type="text" name="nama" placeholder="Masukkan nama sesuai KTP" required>
                </div>

                <div class="form-group">
                    <label>NIK (16 Digit) <span class="req">*</span></label>
                    <input type="number" name="nik" placeholder="Contoh: 3201..." required>
                </div>

                <div class="form-group">
                    <label>Alamat Domisili <span class="req">*</span></label>
                    <textarea name="alamat" placeholder="Ketik alamat lengkap..." rows="2" required></textarea>
                </div>

                <div class="form-group">
                    <label>Nomor WhatsApp <span class="req">*</span></label>
                    <input type="tel" name="nohp" placeholder="0812..." required>
                </div>

                <div class="form-group">
                    <label>Posisi Pekerjaan <span class="req">*</span></label>
                    <div class="select-wrapper">
                        <select name="posisi" required>
                            <option value="" disabled selected>Pilih salah satu</option>
                            <option value="Cleaning Service">Cleaning Service</option>
                            <option value="Satpam">Satpam</option>
                        </select>
                    </div>
                </div>

                <div class="action-area">
                    <button type="submit" class="btn-submit" id="submit-btn">
                        Kirim Data Sekarang
                    </button>
                    <div id="status-message"></div>
                </div>

            </form>
        </main>

        <footer class="form-footer">
            <p>&copy; 2026 Bapekom Manajemen</p>
        </footer>

    </div>

    <script src="js/script.js"></script>
</body>
</html>
